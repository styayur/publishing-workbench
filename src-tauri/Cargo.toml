[package]
name = "publishing-workbench"
version = "0.2.1"
edition = "2021"
description = "Local CMS-agnostic publishing workbench"
license = "AGPL-3.0-only"

[lib]
name = "publishing_workbench"
path = "lib.rs"

[[bin]]
name = "publishing-workbench"
path = "main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:keyring"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = [] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "sync", "rt-multi-thread", "macros"] }
pulldown-cmark = "0.13"
ammonia = "4"
regex = "1"
url = "2"
mime_guess = "2"
html-escape = "0.2"
percent-encoding = "2"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
fs2 = "0.4"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
